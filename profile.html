<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100d1d"><title>Player profile · TRS CIS League</title>
<style>
:root{color-scheme:dark;--violet:#997aff;--green:#39d99a;--muted:#9995aa;--panel:#171522;--line:#ffffff18}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,Montserrat,system-ui,sans-serif;color:#f5f3fa;background:radial-gradient(ellipse at 12% 5%,#37245e 0,transparent 38%),radial-gradient(ellipse at 90% 90%,#432047 0,transparent 35%),#0b0a12}nav{height:68px;padding:0 clamp(18px,4vw,52px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}nav a{color:#f4f1fa;text-decoration:none;font-size:13px;font-weight:800}nav .actions{display:flex;gap:10px;align-items:center}button,.link-button{border:1px solid var(--line);padding:10px 14px;border-radius:9px;background:#ffffff0a;color:#ddd9e9;text-decoration:none;cursor:pointer;font:600 12px inherit}.wrap{width:min(1120px,calc(100% - 32px));margin:42px auto 80px}.hero{position:relative;overflow:hidden;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:22px;padding:32px;background:linear-gradient(110deg,#29203f,#171521 56%,#201526);border:1px solid var(--line);border-radius:22px}.hero:before{content:'';position:absolute;inset:0 auto 0 0;width:4px;background:linear-gradient(var(--violet),#d27aff)}.avatar{width:100px;height:100px;border-radius:22px;background:#292735;border:2px solid #8e73de;object-fit:cover}.eyebrow{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#bca8ff;font-weight:800}h1{font-size:clamp(25px,4vw,38px);margin:7px 0 4px}.handle{color:#a9a4b7}.chips{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid #7561b9;border-radius:999px;padding:7px 12px;background:#51408035;font-size:12px;font-weight:700}.chip.roblox{border-color:#ffffff30;background:#ffffff0c}.verified{color:#4ce5ab}.stats{display:flex;gap:10px}.stat{min-width:90px;padding:13px 15px;background:#0e0d14;border:1px solid var(--line);border-radius:13px}.stat b{display:block;font-size:20px}.stat small{color:var(--muted);font-size:11px}.grid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-top:20px}.card{padding:22px;background:linear-gradient(145deg,#191823,#13121a);border:1px solid var(--line);border-radius:18px}.card h2{font-size:16px;margin:0 0 5px}.sub{font-size:12px;color:var(--muted);margin:0 0 18px}.identity{display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:13px;padding:13px 0;border-top:1px solid var(--line)}.identity img{width:58px;height:58px;border-radius:16px;object-fit:cover;background:#252330}.identity.roblox img{border-radius:50%}.identity strong{display:block;font-size:14px}.identity small{display:block;margin-top:5px;color:var(--muted);font-size:11px;overflow-wrap:anywhere}.badge{border-radius:999px;padding:6px 9px;font-size:10px;color:#55e2ad;background:#39d99a18}.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{padding:13px;border:1px solid var(--line);border-radius:12px;background:#ffffff06}.metric small{display:block;color:var(--muted);font-size:10px;margin-bottom:7px}.metric b{font-size:13px}.status{display:flex;align-items:center;gap:8px;color:#49e0a7;font-weight:800}.dot{width:8px;height:8px;border-radius:50%;background:#49e0a7;box-shadow:0 0 14px #49e0a7}.loading,.error{width:min(520px,calc(100% - 30px));margin:16vh auto;text-align:center;padding:34px;background:var(--panel);border:1px solid var(--line);border-radius:18px;color:#d6d1e1}.error a{color:#c3adff}@media(max-width:760px){.hero{grid-template-columns:auto 1fr;padding:22px;gap:15px}.avatar{width:76px;height:76px}.stats{grid-column:1/-1}.stat{flex:1}.grid{grid-template-columns:1fr}.identity{grid-template-columns:54px 1fr auto}.identity img{width:50px;height:50px}}@media(max-width:430px){.hero{grid-template-columns:1fr;text-align:center}.avatar{margin:auto}.chips{justify-content:center}.stats{grid-column:auto}.wrap{margin-top:22px}}
</style></head><body><nav><a href="/">TRS CIS <span style="color:#b99aff">LEAGUE</span></a><div class="actions"><a class="link-button" href="/">Back to league</a><button id="logout">Log out</button></div></nav><main id="app"><div class="loading">Loading your verified profile…</div></main>
<script>
const app=document.getElementById('app');fetch('/api/profile',{credentials:'same-origin',cache:'no-store'}).then(async r=>{if(r.status===401){location.replace('/verify.html');return null}if(!r.ok)throw new Error('Profile service is unavailable');return r.json()}).then(p=>{if(!p)return;const d=p.discord,r=p.roblox;const date=new Date(p.verifiedAt);app.innerHTML='<div class="wrap"><section class="hero"><img class="avatar" src="'+(r.avatar||'')+'" alt="Roblox avatar" onerror="this.remove()"><div><div class="eyebrow">Verified player</div><h1>'+escapeHtml(r.displayName)+'</h1><div class="handle">@'+escapeHtml(r.username)+'</div><div class="chips"><span class="chip">Discord · '+escapeHtml(d.username)+'</span><span class="chip roblox">Roblox · '+escapeHtml(r.username)+'</span></div></div><div class="stats"><div class="stat"><b>✓</b><small>Verified</small></div><div class="stat"><b>2/2</b><small>Accounts linked</small></div></div></section><div class="grid"><section class="card"><h2>Linked accounts</h2><p class="sub">These accounts are connected to your TRS CIS League profile.</p><div class="identity"><img src="'+(d.avatar||'')+'" alt="Discord avatar" onerror="this.remove()"><div><strong>'+escapeHtml(d.username)+'</strong><small>Discord · ID '+escapeHtml(d.id)+'</small></div><span class="badge">Connected</span></div><div class="identity roblox"><img src="'+(r.avatar||'')+'" alt="Roblox avatar" onerror="this.remove()"><div><strong>'+escapeHtml(r.displayName)+'</strong><small><a style="color:#bca8ff" href="'+escapeHtml(r.profile)+'" target="_blank" rel="noopener">@'+escapeHtml(r.username)+' ↗</a></small></div><span class="badge">Connected</span></div></section><section class="card"><h2>Verification</h2><p class="sub">Verified by the TRS CIS League Discord bot.</p><div class="metric-grid"><div class="metric"><small>ACCOUNT STATUS</small><b class="status"><i class="dot"></i>Verified</b></div><div class="metric"><small>VERIFIED ON</small><b>'+date.toLocaleDateString()+'</b></div><div class="metric"><small>ROBLOX USER ID</small><b>'+escapeHtml(r.id)+'</b></div><div class="metric"><small>DISCORD USER ID</small><b>'+escapeHtml(d.id)+'</b></div></div></section></div></div>'}).catch(()=>{app.innerHTML='<div class="error"><h2>Could not load profile</h2><p>Please reload in a moment.</p><a href="/verify.html">Return to verification</a></div>'});
function escapeHtml(value){const e=document.createElement('span');e.textContent=String(value||'');return e.innerHTML}
document.getElementById('logout').addEventListener('click',()=>location.assign('/api/logout'));
</script></body></html>
